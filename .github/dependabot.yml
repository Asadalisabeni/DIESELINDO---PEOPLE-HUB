version: 2

updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '03:00'
          timezone: Asia/Jakarta
      open-pull-requests-limit: 5

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '03:15'
          timezone: Asia/Jakarta
      open-pull-requests-limit: 5

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '03:30'
          timezone: Asia/Jakarta
      open-pull-requests-limit: 5
